# Built standalone (no sysbuild): MCUboot is built and flashed
# separately. CONFIG_MCUBOOT_SIGNATURE_KEY_FILE defaults to "", so the
# default build does NOT try to sign with a private key -- per
# spec.md's "Separate Bootloader Provisioning from Application Signing".
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
